[workspace]
members  = [
  "server",
  "protocol",
  "server/patches/web-push-native",
  # Family network layer (step 1 compatibility spike). Kept as small, independent
  # crates: a pure policy engine plus separate DNS and proxy protocol workers.
  "crates/family-policy",
  "crates/family-dns",
  "crates/family-proxy",
  "crates/gateway-compat-spike",
  # Vantyr Network worker runtime: worker-local LKG + bounded events.
  "crates/network-runtime",
]
exclude  = ["agent"]   # built separately (cargo xwin for the Windows release); depends on ./protocol by path
resolver = "2"

# Maintained compatibility patch: remove vulnerable pre-0.7 crypto-bigint stack.
[patch.crates-io]
web-push-native = { path = "server/patches/web-push-native" }
