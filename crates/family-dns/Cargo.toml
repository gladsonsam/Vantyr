[package]
name = "family-dns"
version = "0.1.0"
edition = "2021"
description = "Policy-connected DNS worker for Vantyr Network"
publish = false

[[bin]]
name = "vantyr-dns"
path = "src/bin/vantyr-dns.rs"

[[bin]]
name = "vantyr-dns-bundle-convert"
path = "src/bin/vantyr-dns-bundle-convert.rs"

[dependencies]
family-policy          = { path = "../family-policy" }
vantyr-network-runtime = { path = "../network-runtime" }
# Accepted bounded filter compiler (Hickory + maintained adblock, default `abp`
# feature). Family DNS compiles caller-supplied bytes (local files or scheduled
# operator-configured subscriptions); this crate performs no fetching itself.
vantyr-network-filter  = { path = "../network-filter" }
# Accepted bounded HTTPS subscription fetcher. Family DNS reuses its fetcher
# and revalidates cached bytes with the maintained filter compiler; this crate
# adds no HTTP/SSRF/TLS policy of its own.
vantyr-network-subscriptions = { path = "../network-subscriptions" }
# Durable base64 of validated list material inside the one bundle file. Already
# pinned in the workspace lock by network-subscriptions; no new version.
base64           = "=0.22.1"
anyhow           = "=1.0.105"
async-trait      = "=0.1.92"
chrono           = { version = "=0.4.45", features = ["serde"] }
serde            = { version = "=1.0.229", features = ["derive"] }
serde_json       = "=1.0.154"
tokio            = { version = "=1.54.1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "signal"] }
# `tls-aws-lc-rs` enables the maintained DoT server listener API,
# `https-aws-lc-rs` the maintained DoH/h2 server listener API and
# `quic-aws-lc-rs` the maintained DoQ server listener API, on the same pinned
# version already used by the test-only listener below; no new lock version.
hickory-server   = { version = "=0.26.4", features = ["resolver", "tls-aws-lc-rs", "https-aws-lc-rs", "quic-aws-lc-rs"] }
# Maintained DoT/DoH/DoQ upstream and client transports. `webpki-roots` is
# mandatory: without a root source Hickory's client config is empty and every
# verification fails. `quic-aws-lc-rs` also supplies the test-only verifying
# DoQ client; all are feature edges on the pinned version, no new stack.
hickory-resolver = { version = "=0.26.4", default-features = false, features = ["tokio", "serde", "tls-aws-lc-rs", "https-aws-lc-rs", "quic-aws-lc-rs", "webpki-roots"] }
# Maintained range type for operator-configured CIDR source ranges. Already
# pinned in the shared workspace lock by the DNS stack; no new version.
ipnet            = "=2.12.2"
rustls           = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
pem              = "=4.0.0"
# Maintained X.509 validity parser for the operator-configured server cert.
# Already pinned in the shared workspace lock by rcgen; no new version/checksum.
x509-parser      = "=0.18.1"
webpki-roots     = "=1.0.12"
tracing          = "=0.1.44"
tokio-util       = { version = "0.7", features = ["rt"] }

# Controller policy pull. Every version below is already pinned in the shared
# workspace Cargo.lock; no new protocol/parser/crypto version is introduced.
reqwest          = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
url              = "=2.5.9"
uuid             = { version = "=1.29.3", features = ["v4", "serde"] }
secrecy          = "=0.10.3"
sha2             = "=0.10.9"
thiserror        = "=1.0.69"

[target.'cfg(unix)'.dependencies]
libc             = "=0.2.191"

[dev-dependencies]
# Test-only DoT/DoH/DoQ helpers. Cargo unifies these features with the
# production hickory-server package while building integration tests.
hickory-server   = { version = "=0.26.4", features = ["resolver", "tls-aws-lc-rs", "https-aws-lc-rs", "quic-aws-lc-rs"] }
# Already pinned by the Hickory stack; used only to poll the single response
# stream returned by the test-only DoQ client. No new version or checksum.
futures-util     = "=0.3.34"
# Test-only client-side DoH support. `http2` lets reqwest negotiate the single
# `h2` ALPN offered by the listener; h2 is already pinned in the workspace lock,
# so this adds no version or checksum churn. All verification is real CA/SNI.
reqwest          = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
axum             = "=0.8.9"
rcgen            = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
tokio-rustls     = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
