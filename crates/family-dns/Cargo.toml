[package]
name = "family-dns"
version = "0.1.0"
edition = "2021"
description = "Policy-connected DNS worker for Vantyr Network"
publish = false

[[bin]]
name = "vantyr-dns"
path = "src/bin/vantyr-dns.rs"

[dependencies]
family-policy          = { path = "../family-policy" }
vantyr-network-runtime = { path = "../network-runtime" }
anyhow           = "=1.0.105"
async-trait      = "=0.1.92"
chrono           = { version = "=0.4.45", features = ["serde"] }
serde            = { version = "=1.0.229", features = ["derive"] }
serde_json       = "=1.0.154"
tokio            = { version = "=1.54.1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "signal"] }
hickory-server   = { version = "=0.26.4", features = ["resolver"] }
hickory-resolver = { version = "=0.26.4", default-features = false, features = ["tokio", "serde"] }
tracing          = "=0.1.44"
tokio-util       = { version = "0.7", features = ["rt"] }
