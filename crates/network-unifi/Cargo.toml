[package]
name = "vantyr-network-unifi"
version = "0.1.0"
edition = "2021"
description = "Bounded read-only UniFi Network controller adapter and pure DNS setup planner for Vantyr Network"
license = "MIT"
publish = false

[dependencies]
# All versions are already pinned in the workspace Cargo.lock. No new
# protocol/parser/crypto dependency is introduced by this crate.
reqwest     = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
url         = "=2.5.9"
serde       = { version = "=1.0.229", features = ["derive"] }
serde_json  = "=1.0.154"
secrecy     = "=0.10.3"
chrono      = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
sha2        = "=0.10.9"
async-trait = "=0.1.92"
thiserror   = "=1.0.69"

[dev-dependencies]
tokio         = { version = "=1.54.1", features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync"] }
axum          = "=0.8.9"
rustls        = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rcgen         = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
tokio-rustls  = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
