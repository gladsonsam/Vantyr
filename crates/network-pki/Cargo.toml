[package]
name = "vantyr-network-pki"
version = "0.1.0"
edition = "2021"
description = "Dedicated application-generated inspection CA and encrypted key custody for Vantyr Network"
license = "MIT"
publish = false

[dependencies]
# Pinned to the versions actually available from crates.io at implementation time.
# rcgen's default features pull `ring`; this crate uses the maintained aws-lc-rs
# backend instead, so defaults are explicitly off.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
age = { version = "=0.12.1", default-features = false }
secrecy = "=0.10.3"
zeroize = "=1.9.2"
sha2 = "=0.10.9"
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
time = { version = "=0.3.47", features = ["std", "formatting", "parsing"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
# WebPKI validator used only by tests; aws-lc-rs is rustls' default provider here.
rustls = "=0.23.46"
