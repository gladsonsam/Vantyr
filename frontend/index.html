<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vantyr</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- PWA: installable app + OS theming -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#08090b" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vantyr" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- IBM Plex Mono is the xterm terminal face (see TerminalTab); UI type comes from the bundled Geist variable fonts.
         Loaded non-blocking: the terminal falls back to ui-monospace until it arrives. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    </noscript>
    <script>
      // Vantyr ships a single dark palette.
      document.documentElement.classList.add('dark');
    </script>
    <style>
      /* First-paint background + boot splash — shown before the JS bundle mounts,
         so the page never flashes white/black. React replaces #root on mount. */
      html, body { margin: 0; background-color: #08090b; color-scheme: dark; }
      #boot-splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #08090b;
      }
      #boot-splash .ring {
        width: 42px; height: 42px; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: #20dd8f;
        animation: boot-spin 0.85s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash"><div class="ring"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
