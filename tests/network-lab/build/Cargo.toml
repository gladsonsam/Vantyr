# Minimal Cargo workspace used ONLY by tests/network-lab/Dockerfile.vantyr.
#
# This is deliberately not the repository root manifest: the root workspace also
# declares the main server, the HTTP proxy, the back-end PKI foundation and a
# [patch.crates-io] path into server/, none of which belongs in a DNS-lab build
# context. The image builder copies exactly the five crates below plus the
# repository's pinned Cargo.lock. `vantyr-network-runtime` is required because
# the durable `vantyr-dns` worker depends on its typed last-known-good store;
# `vantyr-network-filter` is required since commit c21da216 because the worker
# compiles bounded local hosts/ABP lists and selected service domains from
# immutable material; `vantyr-network-subscriptions` is required by commit
# 39c467e9 because the DNS config schema and worker now depend on its types.
# That dependency is compiled in but is NOT activated here: no lab command
# supplies --subscriptions, so no fetcher or network list traffic exists.
# No gateway, proxy, inspection or PKI crate is pulled in. Third-party
# attribution is carried by `THIRD_PARTY_NOTICES.md` in this directory and
# copied into the runtime image.
[workspace]
members = [
  "crates/family-policy",
  "crates/network-runtime",
  "crates/network-filter",
  "crates/network-subscriptions",
  "crates/family-dns",
]
resolver = "2"
