# WORKING opt-in override for the Vantyr DNS worker.
#
# This is no longer a placeholder: it builds the accepted `vantyr-dns` binary
# from a whitelisted root context and runs it with its real `--config` path.
# It is opt-in only because it is active solely when this file is passed as an
# extra `-f`; the base `compose.yml` upstream-only smoke is unchanged.
#
# Usage (from tests/network-lab):
#   bash scripts/lab.sh fullstack-smoke
#
# Manual equivalent:
#   docker compose -f compose.yml -f compose.vantyr.example.yml \
#     -p vantyr-network-lab up -d --build
#   docker compose -f compose.yml -f compose.vantyr.example.yml \
#     -p vantyr-network-lab down --timeout 5
#
# The worker joins the private internal labnet at 172.26.9.55, forwards only to
# the deterministic stub at 172.26.9.53:15353 and binds the high port 15353 on
# that specific private address (allow_non_loopback is an explicit opt-in in
# the config; a 0.0.0.0 wildcard is intentionally rejected by the worker).
# No host DNS/DHCP/router/firewall/CA change, no host network, no privileged
# port, no Docker socket and no production data is involved.

services:
  vantyr-dns:
    build:
      # Default is the repository root. An operator may point this at a
      # read-only frozen source input for reproducibility; no other behaviour
      # (image, command, network, limits) changes.
      context: ${VANTYR_NETLAB_BUILD_CONTEXT:-../..}
      dockerfile: tests/network-lab/Dockerfile.vantyr
      target: runtime
    # Explicit name so the driver can also run one-off --check-config /
    # startup-failure checks with `docker run --network none`.
    image: "${VANTYR_NETLAB_PROJECT:-vantyr-network-lab}-vantyr-dns:local"
    command: ["--config", "/etc/vantyr/vantyr.lab.json"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./configs/vantyr.lab.json:/etc/vantyr/vantyr.lab.json:ro
    networks:
      labnet:
        ipv4_address: 172.26.9.55
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  # Second assertion client whose source IP is deliberately NOT mapped to a
  # device in the config. It must be answered by the restrictive default
  # profile. It exists only in this opt-in override.
  client-unknown:
    build:
      context: .
      dockerfile: Dockerfile.client
    command: ["sleep", "infinity"]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      labnet:
        ipv4_address: 172.26.9.56
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
