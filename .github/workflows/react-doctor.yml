name: React Doctor

# Scans the dashboard (frontend/) on pull requests and comments the findings
# that the PR introduces.
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: millionco/react-doctor@main
        with:
          directory: frontend
