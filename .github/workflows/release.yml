name: release

# One tag, one release.
# Push a SemVer tag like `v0.1.0` and this workflow:
#   1. runs Windows/Linux agent + server/frontend quality gates,
#   2. builds the Windows agent MSI (+ signed updater latest.json),
#   3. builds the Linux agent tarball,
#   4. verifies updater assets and uploads SHA256SUMS to the draft,
#   5. builds & pushes the version-tagged server image, then marks the draft ready.
# The release is left as a draft so you can finish the notes and publish it
# manually. The Tauri auto-updater only resolves `releases/latest/...` once the
# release is published as a normal (non-prerelease) release; publishing also
# moves the server image's `latest` tag (see release-publish.yml).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the release + upload assets
  packages: write   # push the Docker image to GHCR

# Prevent concurrent reruns from clobbering the same draft assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Quality gate: agent (Rust + UI) --------------------------------------
  checks-agent:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Stamp release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_stamp.py "$env:RELEASE_TAG" --stable
        shell: pwsh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent -> target

      - name: Agent format check
        working-directory: agent
        run: cargo fmt --check

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/ui-src/package-lock.json

      - name: Agent UI install
        working-directory: agent/ui-src
        run: npm ci --no-audit --no-fund

      - name: Agent UI lint
        working-directory: agent/ui-src
        run: npm run lint

      - name: Agent UI build
        working-directory: agent/ui-src
        run: npm run build

      - name: Agent check
        working-directory: agent
        run: cargo check --locked

      - name: Agent test
        working-directory: agent
        run: cargo test --locked

  # ---- Quality gate: server + frontend --------------------------------------
  checks-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install updater signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Test release tools and stamp versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/release_test.py
          python tools/release_stamp.py "$RELEASE_TAG" --stable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Server format check
        run: cargo fmt --all --check

      - name: Server clippy
        run: cargo clippy -p vantyr-server --all-targets --locked -- -D warnings

      - name: Server check
        run: cargo check -p vantyr-server --locked

      - name: Server test
        run: cargo test -p vantyr-server --locked

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend test
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  checks-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxtst-dev libxdo-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgbm-dev pkg-config

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Stamp versions from git tag
        run: python tools/release_stamp.py "$GITHUB_REF_NAME" --stable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: rustfmt (agent linux)
        run: cargo fmt --manifest-path agent/Cargo.toml --all --check

      - name: check (agent linux)
        run: cargo check --manifest-path agent/Cargo.toml --locked

      - name: test (agent linux)
        run: cargo test --manifest-path agent/Cargo.toml --locked

  # ---- Windows agent MSI + creates the (draft) GitHub Release ----------------
  windows-agent:
    runs-on: windows-latest
    needs: [checks-agent, checks-server, checks-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Draft release notes (commits since previous tag)
        id: rel_notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prev="$(git describe --tags --abbrev=0 --exclude="$tag" 2>/dev/null || true)"
          delim="REL_BODY_EOF"
          {
            echo "body<<$delim"
            echo "## Vantyr $tag"
            echo ""
            echo "### Changes"
            if [ -n "$prev" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "${prev}..${tag}"
            else
              git log --no-merges --pretty=format:'- %s (%h)' -n 40 "${tag}"
            fi
            echo ""
            echo ""
            echo "### Downloads"
            echo "- **Windows agent:** installer (\`.msi\`) attached below"
            echo "- **Linux agent:** \`vantyr-agent-linux-x86_64.tar.gz\` attached below"
            echo ""
            echo "### Server (Docker)"
            echo '```'
            echo "docker pull ghcr.io/gladsonsam/vantyr/server:$tag"
            echo '```'
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/ui-src/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent -> target

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset -y

      - name: Install UI dependencies
        shell: pwsh
        working-directory: agent/ui-src
        run: npm ci --no-audit --no-fund

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Stamp versions from git tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_stamp.py "$env:RELEASE_TAG" --stable
        shell: pwsh

      - name: Require updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required for a signed updater release"
          }

      - name: Build MSI + create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: agent
          tagName: ${{ github.ref_name }}
          releaseName: Vantyr ${{ github.ref_name }}
          releaseBody: ${{ steps.rel_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          tauriScript: node ui-src/node_modules/@tauri-apps/cli/tauri.js
          # Override the checked-in npm install hook for reproducible releases.
          args: --config '{"build":{"beforeBuildCommand":{"script":"npm ci --no-audit --no-fund && npm run build","cwd":"ui-src"}}}' -- --locked

  # ---- Linux agent tarball -> attached to the same draft release -------------
  linux-agent:
    runs-on: ubuntu-latest
    needs: windows-agent   # ensures the draft release already exists
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxtst-dev libxdo-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgbm-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Stamp versions from git tag
        run: python tools/release_stamp.py "$GITHUB_REF_NAME" --stable

      - name: Build
        working-directory: agent
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Stage artifact
        run: |
          mkdir -p dist/vantyr-agent-linux/packaging
          cp agent/target/x86_64-unknown-linux-gnu/release/vantyr-agent dist/vantyr-agent-linux/
          cp -R agent/packaging/linux dist/vantyr-agent-linux/packaging/
          tar -C dist -czf vantyr-agent-linux-x86_64.tar.gz vantyr-agent-linux

      - name: Attach Linux tarball to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" vantyr-agent-linux-x86_64.tar.gz --clobber

  # ---- Server Docker image -> GHCR ------------------------------------------
  server-image:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    needs: [checks-agent, checks-server, checks-linux, release-assets]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Stamp versions from git tag
        run: python tools/release_stamp.py "$GITHUB_REF_NAME" --stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/gladsonsam/vantyr/server
          tags: |
            type=ref,event=tag

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Verify both agent packages and updater metadata before publishing the image.
  release-assets:
    runs-on: ubuntu-latest
    needs: [windows-agent, linux-agent]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install updater signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - name: Verify draft assets and upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets
          python tools/release_verify.py release-assets "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" --tauri-config agent/tauri.conf.json
          gh release upload "$GITHUB_REF_NAME" release-assets/SHA256SUMS --clobber

  # Presence of this marker means every gate, package and image job succeeded.
  release-ready:
    runs-on: ubuntu-latest
    needs: [release-assets, server-image]
    steps:
      - uses: actions/checkout@v7
      - name: Mark draft ready for manual publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.server-image.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          digest = os.environ["IMAGE_DIGEST"]
          if not digest.startswith("sha256:"):
              raise SystemExit("Missing server image digest")
          Path("RELEASE_READY.json").write_text(json.dumps({
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "server_image_digest": digest,
              "workflow_run": os.environ["GITHUB_RUN_ID"],
          }, indent=2) + "\n")
          PYTHON
          gh release upload "$GITHUB_REF_NAME" RELEASE_READY.json --clobber
