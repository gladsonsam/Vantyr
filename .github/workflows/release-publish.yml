name: release-publish

# Runs when a draft created by release.yml is published manually. Only then does
# the server image's `latest` tag move, to the exact digest recorded in the
# release's RELEASE_READY.json (no rebuild).

on:
  release:
    types: [published]

permissions:
  contents: read    # read the release marker asset
  packages: write   # retag the Docker image in GHCR

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  server-image-latest:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest at the released image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          IMAGE: ghcr.io/gladsonsam/vantyr/server
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern RELEASE_READY.json
          test "$(jq -r .tag RELEASE_READY.json)" = "$TAG"
          digest="$(jq -r .server_image_digest RELEASE_READY.json)"
          case "$digest" in sha256:*) ;; *) echo "Missing server image digest" >&2; exit 1 ;; esac
          # The version tag must still resolve to the recorded digest.
          test "$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$digest"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$digest"
